<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Copiado de auth/login.html - Diseño 1 */
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1050;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        .login-header {
            background: linear-gradient(135deg, #2d3436 0%, #000 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #eee;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #eee;
            border-right: none;
            border-radius: 10px 0 0 10px;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Botón flotante para volver a la guía -->
    <a href="../index.html" class="btn btn-light back-btn">
        <i class="bi bi-arrow-left me-1"></i>Volver a la Guía
    </a>

    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-laptop display-4"></i>
                <h3 class="mt-3 mb-0">TechStore</h3>
                <p class="mb-0 opacity-75">Inicia sesión en tu cuenta</p>
            </div>
            <div class="login-body">
                <form id="loginForm" novalidate>
                    <!-- Email - Validación de javascript/validaciones.html -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" 
                                   placeholder="tu@email.com" required>
                        </div>
                        <div class="error-message" id="emailError">Email inválido</div>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" 
                                   placeholder="••••••••" required minlength="6">
                            <button type="button" class="btn btn-outline-secondary" 
                                    onclick="togglePassword()">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                        <div class="error-message" id="passwordError">Mínimo 6 caracteres</div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Recordarme</label>
                        </div>
                        <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-login text-white w-100 mb-3">
                        Iniciar Sesión
                    </button>
                    
                    <p class="text-center text-muted mb-0">
                        ¿No tienes cuenta? 
                        <a href="registro.html" class="text-decoration-none fw-bold">Regístrate</a>
                    </p>
                </form>
                
                <div class="alert alert-success mt-3" id="successAlert" style="display: none;">
                    ¡Inicio de sesión exitoso! Redirigiendo...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // =============================================
        // VALIDACIÓN - De javascript/validaciones.html
        // =============================================
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        function validateEmail(email) {
            return emailRegex.test(email);
        }
        
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
        
        // Validación en tiempo real - De javascript/eventos.html
        document.getElementById('email').addEventListener('input', function() {
            const error = document.getElementById('emailError');
            if (this.value && !validateEmail(this.value)) {
                error.classList.add('show');
                this.classList.add('is-invalid');
            } else {
                error.classList.remove('show');
                this.classList.remove('is-invalid');
            }
        });
        
        document.getElementById('password').addEventListener('input', function() {
            const error = document.getElementById('passwordError');
            if (this.value && this.value.length < 6) {
                error.classList.add('show');
                this.classList.add('is-invalid');
            } else {
                error.classList.remove('show');
                this.classList.remove('is-invalid');
            }
        });
        
        // Submit del formulario
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Validar
            let isValid = true;
            
            if (!validateEmail(email)) {
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            }
            
            if (password.length < 6) {
                document.getElementById('passwordError').classList.add('show');
                isValid = false;
            }
            
            if (isValid) {
                // Simular login - De javascript/storage.html
                const user = {
                    email: email,
                    name: email.split('@')[0],
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('user', JSON.stringify(user));
                
                document.getElementById('successAlert').style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        });
    </script>
</body>
</html>
