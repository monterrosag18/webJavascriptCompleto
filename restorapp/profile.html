<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestorApp - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">
                <i class="bi bi-shop text-white fs-4"></i>
            </div>
            
            <div class="sidebar-nav">
                <a href="menu.html" class="nav-item" title="Menu">
                    <i class="bi bi-grid-3x3-gap fs-5"></i>
                </a>
                <a href="profile.html" class="nav-item" title="My Orders">
                    <i class="bi bi-receipt fs-5"></i>
                </a>
                <a href="profile.html" class="nav-item active" title="Profile">
                    <i class="bi bi-person fs-5"></i>
                </a>
            </div>
            
            <div class="sidebar-bottom">
                <a href="index.html" class="nav-item" title="Logout">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content" style="padding: 0;">
            <div class="profile-container">
                <!-- Left Section - Orders -->
                <div class="profile-sidebar">
                    <div class="orders-section">
                        <!-- Tabs -->
                        <div class="d-flex gap-2 mb-4">
                            <button class="filter-tab active" data-view="orders">My Orders</button>
                            <button class="filter-tab" data-view="profile">Profile</button>
                        </div>

                        <div class="section-header">
                            <h3 class="section-title">Recent Orders</h3>
                            <div class="filter-tabs">
                                <button class="filter-tab active" data-filter="all">All</button>
                            </div>
                        </div>

                        <!-- Orders List -->
                        <div id="ordersList">
                            <!-- Orders will be loaded by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Right Section - Account Details -->
                <div class="profile-main">
                    <div class="account-details">
                        <div class="account-header">
                            <h3 class="section-title">Account Details</h3>
                            <button class="btn-logout" id="logoutBtn">
                                <i class="bi bi-box-arrow-right me-2"></i>Log Out
                            </button>
                        </div>

                        <div class="profile-avatar">
                            <img src="https://ui-avatars.com/api/?name=Alex+Student&background=22c55e&color=fff&size=80" 
                                 alt="Profile" class="avatar-img" id="avatarImg">
                            <h4 class="profile-name" id="profileName">Alex Student</h4>
                            <p class="profile-email" id="profileEmail">alex.student@example.com</p>
                            <button class="btn btn-outline-secondary btn-sm mt-2">
                                <i class="bi bi-camera me-1"></i>Update
                            </button>
                        </div>

                        <div class="account-stats">
                            <div class="stat-item">
                                <div class="stat-value" id="totalOrders">12</div>
                                <div class="stat-label">Orders</div>
                            </div>
                            <div class="stat-item highlight">
                                <div class="stat-value" id="loyaltyPoints">450</div>
                                <div class="stat-label">Loyalty Points</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="totalSpent">$85</div>
                                <div class="stat-label">Total Spent</div>
                            </div>
                        </div>

                        <ul class="account-menu">
                            <li>
                                <span><i class="bi bi-credit-card me-3"></i>Payment Methods</span>
                                <i class="bi bi-chevron-right"></i>
                            </li>
                            <li>
                                <span><i class="bi bi-geo-alt me-3"></i>Saved Addresses</span>
                                <i class="bi bi-chevron-right"></i>
                            </li>
                            <li>
                                <span><i class="bi bi-bell me-3"></i>Notifications</span>
                                <i class="bi bi-chevron-right"></i>
                            </li>
                            <li>
                                <span><i class="bi bi-gear me-3"></i>Preferences</span>
                                <i class="bi bi-chevron-right"></i>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
