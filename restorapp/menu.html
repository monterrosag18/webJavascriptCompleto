<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestorApp - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">
                <i class="bi bi-shop text-white fs-4"></i>
            </div>
            
            <div class="sidebar-nav">
                <a href="menu.html" class="nav-item active" title="Menu">
                    <i class="bi bi-grid-3x3-gap fs-5"></i>
                </a>
                <a href="profile.html" class="nav-item" title="My Orders">
                    <i class="bi bi-receipt fs-5"></i>
                </a>
                <a href="profile.html" class="nav-item" title="Profile">
                    <i class="bi bi-person fs-5"></i>
                </a>
            </div>
            
            <div class="sidebar-bottom">
                <a href="index.html" class="nav-item" title="Logout">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Menu Section -->
            <section class="menu-section">
                <!-- Header -->
                <header class="menu-header">
                    <div>
                        <h1>Our Menu</h1>
                    </div>
                    
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Search foods...">
                    </div>
                    
                    <nav class="top-nav">
                        <a href="menu.html" class="active">Menu</a>
                        <a href="profile.html">My Orders</a>
                        <a href="profile.html">Profile</a>
                    </nav>
                </header>

                <!-- Category Tabs -->
                <div class="category-tabs">
                    <button class="category-tab active" data-category="all">
                        <i class="bi bi-grid"></i>
                        All
                    </button>
                    <button class="category-tab" data-category="burgers">
                        <i class="bi bi-circle-fill" style="color: #f59e0b;"></i>
                        Burgers
                    </button>
                    <button class="category-tab" data-category="sides">
                        <i class="bi bi-box"></i>
                        Sides
                    </button>
                    <button class="category-tab" data-category="drinks">
                        <i class="bi bi-cup-straw"></i>
                        Drinks
                    </button>
                    <button class="category-tab" data-category="pizza">
                        <i class="bi bi-pie-chart-fill" style="color: #ef4444;"></i>
                        Pizza
                    </button>
                </div>

                <!-- Products Grid -->
                <div class="products-grid" id="productsGrid">
                    <!-- Products will be loaded by JavaScript -->
                </div>
            </section>

            <!-- Cart Sidebar -->
            <aside class="cart-sidebar">
                <div class="cart-header">
                    <h2>Your Order</h2>
                    <div class="cart-status">
                        <i class="bi bi-circle-fill"></i>
                        Dine in
                    </div>
                </div>

                <div class="cart-items" id="cartItems">
                    <!-- Cart items will be loaded by JavaScript -->
                    <div class="empty-state" id="emptyCart">
                        <i class="bi bi-cart3"></i>
                        <h4>Your cart is empty</h4>
                        <p>Add items from the menu to get started</p>
                    </div>
                </div>

                <div class="cart-footer">
                    <div class="cart-summary">
                        <div class="cart-summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Tax (8%)</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="cart-summary-row total">
                            <span>Total</span>
                            <span id="total">$0.00</span>
                        </div>
                    </div>
                    
                    <button class="btn-confirm-order" id="confirmOrder">
                        Confirm Order
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
