<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestorApp - Sistema de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <div class="login-background">
        <div class="login-circle"></div>
    </div>
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <!-- Logo -->
                        <div class="text-center mb-4">
                            <div class="logo-icon mx-auto mb-3">
                                <i class="bi bi-shop text-success fs-1"></i>
                            </div>
                            <h2 class="login-title fw-bold">RestorApp</h2>
                            <p class="login-subtitle">Sign in to your account</p>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label login-label small">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text login-input-icon">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" class="form-control login-input" 
                                           id="fullName" placeholder="John Doe" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label login-label small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text login-input-icon">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control login-input" 
                                           id="email" placeholder="john@example.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label login-label small">Select Role</label>
                                <div class="input-group">
                                    <span class="input-group-text login-input-icon">
                                        <i class="bi bi-person-badge"></i>
                                    </span>
                                    <select class="form-select login-input" id="userRole">
                                        <option value="user">User</option>
                                        <option value="admin">Admin</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                                Sign In
                            </button>
                        </form>

                        <!-- Sign Up Link -->
                        <div class="text-center mt-4">
                            <span class="login-text-muted">Don't have an account?</span>
                            <a href="#" class="text-success text-decoration-none ms-1">Sign up</a>
                        </div>

                        <!-- Social Login -->
                        <div class="text-center mt-4">
                            <p class="login-text-muted small mb-3">Or continue with</p>
                            <div class="d-flex justify-content-center gap-3">
                                <button class="btn btn-outline-secondary btn-sm px-3">
                                    <i class="bi bi-facebook"></i>
                                </button>
                                <button class="btn btn-outline-secondary btn-sm px-3">
                                    <i class="bi bi-google"></i>
                                </button>
                                <button class="btn btn-outline-secondary btn-sm px-3">
                                    <i class="bi bi-apple"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
